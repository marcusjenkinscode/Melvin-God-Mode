{% extends "base.html" %}
{% block title %}Melvin God Mode — Agents{% endblock %}

{% block content %}
<div class="container">

  <div class="page-header">
    <h2>🤖 Agent Orchestration</h2>
    <p>Autonomous AI agents — each specialised for a different domain</p>
  </div>

  <!-- ── Run a task ────────────────────────────────────── -->
  <div class="card mb-lg">
    <div class="card-header"><h3>Dispatch Task</h3></div>
    <div class="grid-3" style="gap:12px;align-items:end">
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">Agent</label>
        <select id="agent-select">
          <option value="">Select agent…</option>
        </select>
      </div>
      <div class="form-group" style="grid-column:span 2;margin-bottom:0">
        <label class="form-label">Task Description</label>
        <input type="text" id="task-input" placeholder="Describe the task to dispatch…" />
      </div>
    </div>
    <div class="flex gap-md mt-md items-center">
      <button class="btn btn-primary" onclick="runTask()">▶ Run Task</button>
      <span id="task-result" class="text-sm text-dim"></span>
    </div>
  </div>

  <!-- ── Agent cards ──────────────────────────────────── -->
  <div class="grid-3" id="agent-cards">
    <div class="text-muted text-center" style="grid-column:1/-1;padding:40px 0">
      <span class="spinner"></span> Loading agents…
    </div>
  </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
  const AGENT_ICONS = {
    planner:   "🗺",
    coder:     "💻",
    debugger:  "🐛",
    devops:    "⚙",
    research:  "🔬",
    security:  "🔒",
    architect: "🏗",
  };

  const AGENT_DESCS = {
    planner:   "Breaks down complex goals into step-by-step execution plans.",
    coder:     "Writes, refactors, and reviews code across any language.",
    debugger:  "Traces errors, inspects stack traces, and proposes fixes.",
    devops:    "Manages infrastructure, CI/CD pipelines, and deployments.",
    research:  "Performs deep-dive research and synthesises findings.",
    security:  "Audits code and infrastructure for vulnerabilities.",
    architect: "Designs scalable system architectures and ERDs.",
  };

  function loadAgents() {
    fetch("/api/agents")
      .then(r => r.json())
      .then(data => {
        const agents = data.agents || [];
        const sel = document.getElementById("agent-select");
        sel.innerHTML = '<option value="">Select agent…</option>';
        agents.forEach(a => {
          const opt = document.createElement("option");
          opt.value = a.id; opt.textContent = a.name;
          sel.appendChild(opt);
        });
        renderAgentCards(agents);
      })
      .catch(() => {
        document.getElementById("agent-cards").innerHTML =
          '<div class="text-danger text-center" style="grid-column:1/-1;padding:40px 0">Failed to load agents.</div>';
      });
  }

  function renderAgentCards(agents) {
    const grid = document.getElementById("agent-cards");
    grid.innerHTML = agents.map(a => `
      <div class="card">
        <div class="card-header">
          <h3>${AGENT_ICONS[a.id] || "🤖"} ${a.name}</h3>
          <span class="badge ${a.status === "idle" ? "badge-grey" : "badge-green"}">${a.status}</span>
        </div>
        <p class="text-dim text-sm mb-md">${AGENT_DESCS[a.id] || "Autonomous AI agent."}</p>
        <div class="flex gap-sm" style="flex-wrap:wrap">
          <button class="btn btn-sm" onclick="quickDispatch('${a.id}', '${a.name}')">▶ Quick Run</button>
          <span class="text-xs text-muted" style="align-self:center">Module: ${a.module}</span>
        </div>
      </div>`).join("");
  }

  function runTask() {
    const agent = document.getElementById("agent-select").value;
    const task  = document.getElementById("task-input").value.trim();
    const result = document.getElementById("task-result");
    if (!agent) { showToast("Select an agent.", "warn"); return; }
    if (!task)  { showToast("Enter a task description.", "warn"); return; }

    result.textContent = "Dispatching…";
    fetch("/api/agents/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ agent, task })
    })
    .then(r => r.json())
    .then(d => {
      if (d.error) { showToast(d.error, "error"); result.textContent = ""; }
      else { showToast(d.message || "Task queued!", "success"); result.textContent = d.message || ""; }
    })
    .catch(() => { showToast("Dispatch failed.", "error"); result.textContent = ""; });
  }

  function quickDispatch(agentId, agentName) {
    document.getElementById("agent-select").value = agentId;
    document.getElementById("task-input").focus();
    showToast(`${agentName} selected — enter your task above.`, "info");
  }

  document.addEventListener("DOMContentLoaded", loadAgents);
</script>
{% endblock %}
